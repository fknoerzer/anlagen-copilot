[project]
name = "anlagen-copilot"
version = "0.1.0"
description = "RAG-Copilot für Anlagen- und Maschinendokumentation mit Seitenbelegen"
readme = "README.md"
authors = [
    { name = "fknorzer", email = "knoerzerflorian@web.de" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "openai>=2.48.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf[crypto]>=6.15.0",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
]

[project.scripts]
anlagen-copilot = "anlagen_copilot.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "G", "LOG"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.deptry.per_rule_ignores]
# anlagen_copilot ist das eigene Package, kein transitives Fremdpaket —
# deptry erkennt Self-Imports im src-Layout hier fälschlich als DEP003.
DEP003 = ["anlagen_copilot"]
# Bewusst vorab für geplante Arbeit eingetragen, noch nicht verdrahtet.
DEP002 = ["fastapi", "langchain", "openai", "pgvector"]
