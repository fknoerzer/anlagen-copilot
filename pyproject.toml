[project]
name = "anlagen-copilot"
version = "0.1.0"
description = "RAG-Copilot für Anlagen- und Maschinendokumentation mit Seitenbelegen"
readme = "README.md"
authors = [
    { name = "fknorzer", email = "knoerzerflorian@web.de" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "ftfy>=6.3.1",
    "httpx>=0.28.1",
    "openai>=2.48.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf[crypto]>=6.15.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
anlagen-copilot = "anlagen_copilot.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "G", "LOG", "D"]
ignore = ["D105", "D107"]  # dunder methods, __init__

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "D104"]

[tool.pytest.ini_options]
# --strict-markers turns a mistyped @pytest.mark.integraton from a warning into
# an error. It does not cover the command line: -m integraton silently
# deselects everything, -m "not integraton" silently runs everything.
addopts = "--strict-markers"
markers = ["integration: needs a running Postgres (docker compose up -d)"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.deptry.per_rule_ignores]
# anlagen_copilot is this project's own package, not a transitive third-party
# one — deptry misreads self-imports in the src layout as DEP003.
DEP003 = ["anlagen_copilot"]
# Declared ahead of the work that will use it, not wired up yet.
DEP002 = ["fastapi"]
