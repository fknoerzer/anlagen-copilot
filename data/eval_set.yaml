      Härtefall: RDY "ROT-schnell" allein bedeutet etwas anderes als wenn
      beide LEDs gleichzeitig schnell rot blinken, testet ob das System die
      Kombination beider Spalten liest statt nur eine LED-Farbe zu matchen.
      v3: Belegseite 346 statt 340 (gedruckte statt PDF-Seitenzahl; PDF-S. 340
      nennt nur das fehlgeschlagene Firmware-Update mit leuchtender BF).

