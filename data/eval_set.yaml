# Eval-Set: Fragen mit erwarteten Belegseiten (Retrieval) und Fakten (Antwort).
version: v4
questions:
  - id: q-001
    category: diagram
    question: >-
      Zwischen welchen Bauteilen liegt das Distanzrohr auf der Abtriebswelle in einem Stirnradgetriebe R67?
    expected_sources:
      - any_of_pages:
          - document_id: sew-getriebe-ba
            page: 12
    required_facts:
      - "Das Distanzrohr [17] befindet sich zwischen Wälzlager [11] und Rad [6]."
    supplementary_facts: []
    notes: >-
      Härtefall: räumliche Zuordnung aus einer Explosionszeichnung
      (Positionsnummern + Legende). Rad und Wälzlager kommen mehrfach vor,
      testet korrekte Disambiguierung über die Positionsnummer statt Raten.
      Zwei Distanzrohre ([17] Abtriebswelle, [32] Ritzelwelle), daher nennt
      die Frage die Abtriebswelle. Die Lage steht nur in der Zeichnung, nicht
      im pypdf-Text.

  - id: q-002
    category: diagram
    question: >-
      Wo steht auf dem Typenschild meines Getriebemotors R67 DRN90L4 die Wärmeklasse?
    expected_sources:
      - any_of_pages:
          - document_id: sew-getriebe-ba
            page: 22
    required_facts:
      - "Die Wärmeklasse ist auf dem Typenschild mit 'Th.Kl.' gekennzeichnet."
      - "Die Wärmeklasse befindet sich mittig links außen auf dem Typenschild."
      - "Die Wärmeklasse liegt direkt unterhalb der Zeile mit CosΦ (Leistungsfaktor)."
    supplementary_facts:
      - "Die Wärmeklasse befindet sich an Position [7] in der Abbildung des Handbuchs."
    notes: >-
      Härtefall: Positionsnummern nur über separate Legende erschließbar,
      testet ob Bild-Layout und Legende sinnvoll verknüpft werden. Bewusst nur
      nach der Position gefragt, nicht nach dem Wert (130(B)): das Typenschild
      ist ein Illustrationsbeispiel, der Wert keine echte Fachinformation. Die
      Lage auf dem Schild fehlt im pypdf-Text: für naive ein erwarteter
      Fehltreffer.

  - id: q-003
    category: diagram
    question: >-
      Auf dem Typenschild meines Schneckengetriebes S47 steht M4. Wie muss das Getriebe eingebaut werden?
    expected_sources:
      - any_of_pages:
          - document_id: sew-getriebe-ba
            page: 28
    required_facts:
      - "In Raumlage M4 steht der Motor senkrecht oben auf dem Getriebe."
    supplementary_facts:
      - "M4 auf dem Typenschild bezeichnet die Raumlage des Getriebes."
      - "Die Abtriebswelle liegt in M4 waagerecht."
      - "Motorachse und Abtriebswelle stehen rechtwinklig zueinander (Winkelgetriebe)."
      - "Die Raumlagen-Darstellung gilt gemeinsam für Kegelrad-, Schnecken- und SPIROPLAN-Winkelgetriebe (K.., S.., W..)."
    notes: >-
      Härtefall: Die Grafik nennt K.., S.. und W.. gemeinsam, die Frage nur
      S... Die Lage des Motors ist Bildinhalt, nicht im pypdf-Text: für naive
      ein erwarteter Fehltreffer, braucht Bildverständnis. v3: Belegseite 28
      statt 29 (verzählt). v4: Ersetzt eine Ja/Nein-Frage zur Darstellung im
      Handbuch (alte Antworten siehe TODO).

  - id: q-004
    category: unanswerable
    question: >-
      Welche Akkulaufzeit hat der SINAMICS G120C im Batteriebetrieb?
    expected_sources: []
    required_facts: []
    supplementary_facts: []
    notes: >-
      Frage ergibt fachlich keinen Sinn (Umrichter hat keinen Akku), prüft, ob
      das System ablehnt statt zu halluzinieren. Erwartet ist die reine
      Ablehnung ohne Richtigstellung, eine Ablehnung trägt keine Belege (ADR
      013).

  - id: q-005
    category: lookup
    question: >-
      Wann kann es bei meinem Kegelradgetriebe K67 zu erhöhten Planschverlusten kommen?
    expected_sources:
      - any_of_pages:
          - document_id: sew-getriebe-ba
            page: 29
    required_facts:
      - "Erhöhte Planschverluste können auftreten, wenn die Raumlage bewirkt, dass die 1. Getriebestufe vollständig in den Schmierstoff eintaucht."
      - "Erhöhte Planschverluste können auch auftreten, wenn eine hohe mittlere eintreibende Drehzahl zu hoher Umfangsgeschwindigkeit der Zahnräder der Eintriebsstufe führt."
    supplementary_facts: []
    notes: >-
      Baseline-Lookup, zwei Bedingungen in einer Aufzählung, testet ob beide
      vollständig erfasst werden statt nur der ersten. Kein W..: für einige
      W-Typen gilt eine Universalraumlage.

  - id: q-006
    category: table
    question: >-
      Wie fest ziehe ich eine Verschluss-Schraube M12 × 1,5 an meinem Flachgetriebe F57 an, etwa die Ölablassschraube?
    expected_sources:
      - any_of_pages:
          - document_id: sew-getriebe-ba
            page: 80
    required_facts:
      - "15 Nm."
    supplementary_facts: []
    notes: >-
      Härtefall: direkt danach folgt eine optisch identische Tabelle mit
      anderen Gewinden (M16-M42) und anderen Werten, testet ob Retrieval beide
      Tabellen sauber unterscheidet statt sie zu vermischen. Die Tabellen
      darüber nennen auch M12, für die Flanschbefestigung ohne Drehmoment.

  - id: q-007
    category: multi-hop
    question: >-
      In welchem Umgebungstemperaturbereich darf mein Stirnradgetriebe R47 mit Standard-CLP-Öl VG 220 laufen?
    expected_sources:
      - any_of_pages:
          - document_id: sew-schmierstoffe
            page: 7
          - document_id: sew-getriebe-ba
            page: 212
      - any_of_pages:
          - document_id: sew-schmierstoffe
            page: 5
          - document_id: sew-getriebe-ba
            page: 209
    required_facts:
      - "Standard-CLP-Öl VG 220 deckt für Stirnradgetriebe R.. den Umgebungstemperaturbereich von -15°C bis +40°C ab."
      - "-15 °C bis +80 °C über den Produkten ist die zulässige Ölsumpftemperatur, nicht die Umgebungstemperatur."
    supplementary_facts:
      - "Für VG 220 Standard-CLP ist u. a. das Produkt SEW GearOil Base 220 freigegeben."
      - "Für VG 220 Standard-CLP ist u. a. das Produkt Mobilgear 600 XP 220 freigegeben."
      - "Für VG 220 Standard-CLP ist u. a. das Produkt Klüberoil GEM 1-220 N freigegeben."
      - "Zusätzlich sind die thermischen Einsatzgrenzen der Radialwellendichtring-Werkstoffe zu beachten."
    notes: >-
      Härtefall: Die Tabelle nennt Umgebung (-15 bis +40) und Ölsumpf je
      Produkt (-15 bis +80); was welcher Bereich ist, steht nur in der
      Legende. v3: zwei Quellen, Tabelle und Legende, je mit gleichwertiger
      Seite in der Betriebsanleitung. v4: "und wo steht das?" gestrichen.

  - id: q-008
    category: multi-hop
    question: >-
      Mein Umrichter G120C zeigt F07011 Motor Übertemperatur. Wie reagiert der Umrichter, und was kann ich an meinem Motor DRN90L4 tun, damit er nicht wieder zu heiß wird?
    expected_sources:
      - any_of_pages:
          - document_id: siemens-g120c-liste
            page: 501
      - any_of_pages:
          - document_id: sew-motoren-drn
            page: 261
    required_facts:
      - "F07011 'Motor Übertemperatur' löst am Umrichter die Reaktion AUS2 aus."
      - "Bei ungenügender Kühlung gegebenenfalls einen Fremdlüfter nachrüsten."
      - "Den Luftfilter kontrollieren und gegebenenfalls reinigen oder austauschen."
    supplementary_facts:
      - "Mögliche Ursachen für F07011 sind Motorüberlastung, zu hohe Motor-Umgebungstemperatur oder Drahtbruch/nicht angeschlossener Sensor."
      - "Bei ungenügender Kühlung die Kühlluftzufuhr sicherstellen bzw. die Kühlluftwege freimachen."
      - "Bei Überlastung eine Leistungsmessung durchführen, die Projektierung überprüfen und ggf. einen größeren Motor einsetzen oder die Belastung reduzieren."
      - "Bei zu hoher Umgebungstemperatur den zulässigen Temperaturbereich beachten und ggf. die Belastung reduzieren."
    notes: >-
      Entspricht dem zweiten cross_references-Muster in corpus.yaml (Störcode
      am Umrichter und Auswirkung auf den Motor). Härtefall: beide Dokumente
      verweisen wechselseitig aufeinander, testet ob Retrieval beide
      Richtungen findet, nicht nur eine. v4: Fremdlüfter und Luftfilter stehen
      nur im SEW-Handbuch und sind deshalb erforderlich; den Rest nennt auch
      S. 501.

  - id: q-009
    category: lookup
    question: >-
      Wie oft muss ich meinen Motor DRN100LS4 warten, und was ist dabei zu tun?
    expected_sources:
      - any_of_pages:
          - document_id: sew-motoren-drn
            page: 131
    required_facts:
      - "Der Motor ist alle 10000 Betriebsstunden zu inspizieren."
      - "Dabei die Wälzlager prüfen und gegebenenfalls wechseln."
      - "Dabei die Wellendichtringe wechseln."
      - "Dabei die Kühlluftwege reinigen."
    supplementary_facts:
      - "Das Intervall hängt von äußeren Einflüssen ab und kann deutlich kürzer sein, z. B. bei hohem Staubgehalt in der Umgebung."
      - "Für den Antrieb gilt ein unterschiedliches Intervall: Korrosionsschutzanstrich ausbessern, Luftfilter prüfen und gegebenenfalls reinigen, Kondenswasserbohrung und verschlossene Bohrungen reinigen."
      - "Das Anschlusskabel wird im selben Intervall wie der Motor auf Beschädigungen geprüft, die Kabelverschraubungen werden gegebenenfalls nachgezogen."
    notes: >-
      Einfacher Lookup aus einer Wartungsintervall-Tabelle (Baseline).
      Baugröße unter 225 gewählt: für DRN225 – 315 gelten verkürzte
      Nachschmierfristen (Fußnote 2, S. 132). Ohne Bremse, die Bremsenzeilen
      gelten nicht.

  - id: q-010
    category: lookup
    question: >-
      Kann ich STO am G120C als Not-Aus verwenden?
    expected_sources:
      - any_of_pages:
          - document_id: siemens-g120c-kurz
            page: 270
    required_facts:
      - "STO eignet sich nicht zur Realisierung eines Not-Aus."
      - "STO schaltet keine elektrische Spannung sicher aus."
    supplementary_facts:
      - "STO eignet sich zur Realisierung eines Not-Halts."
    notes: >-
      Kontraintuitiver Fakt: STO ≠ Not-Aus, obwohl STO den Antrieb sicher
      stoppt. Testet, ob das System die Nuance wiedergibt statt pauschal
      zuzustimmen. v3: Belegseite 270 statt 264 (gedruckte statt
      PDF-Seitenzahl). v4: Die zweispaltige Tabelle (Not-Aus/Not-Halt)
      verliert bei pypdf die Spalten, die Läufe auf a2454fd vertauschen sie
      (siehe TODO).

  - id: q-011
    category: lookup
    question: >-
      Wir bestellen ein Schneckengetriebe S67, das vor der Montage etwa ein Jahr im Lager liegen wird. Brauche ich dafür eine besondere Ausführung?
    expected_sources:
      - any_of_pages:
          - document_id: sew-katalog-projektierung
            page: 19
    required_facts:
      - "Ja, das Getriebe sollte in der Ausführung 'Langzeitlagerung' bestellt werden."
      - "SEW-EURODRIVE empfiehlt die Ausführung 'Langzeitlagerung' bei einer Lagerzeit von mehr als 9 Monaten."
    supplementary_facts:
      - "Dem Schmierstoff wird ein VCI-Korrosionsschutzmittel beigemischt, das nur im Temperaturbereich -25 °C bis +50 °C wirksam ist."
      - "Das Getriebe muss bis zur Inbetriebnahme dicht verschlossen bleiben, damit sich das Korrosionsschutzmittel nicht verflüchtigt."
      - "Vor der Inbetriebnahme muss der Ölstand kontrolliert werden."
    notes: >-
      Einfacher Fließtext-Lookup. v4: Fragt jetzt vor der Bestellung, ohne das
      Stichwort zu nennen.

  - id: q-012
    category: diagram
    question: >-
      Ich lege ein Stirnradgetriebe R77 aus: Welcher Stoßgrad (I, II, III) ergibt bei gleicher Schalthäufigkeit den höchsten Betriebsfaktor fB, und warum?
    expected_sources:
      - any_of_pages:
          - document_id: sew-katalog-projektierung
            page: 50
    required_facts:
      - "Stoßgrad III hat den höchsten Betriebsfaktor fB."
      - "Stoßgrad III bedeutet stark ungleichförmige Belastung (Massenbeschleunigungsfaktor ≤ 10)."
      - "Begründung: Der Betriebsfaktor berücksichtigt die Auswirkung der Arbeitsmaschine auf das Getriebe; je ungleichförmiger die Belastung, desto höher der Betriebsfaktor."
    supplementary_facts:
      - "Stoßgrad I bedeutet gleichförmige Belastung (Massenbeschleunigungsfaktor ≤ 0,2)."
      - "Stoßgrad II bedeutet ungleichförmige Belastung (Massenbeschleunigungsfaktor ≤ 3)."
    notes: >-
      Härtefall: Kurvenvergleich in einem Kennliniendiagramm mit drei
      überlagerten Kurven, testet ob das System die relative Lage der Kurven
      zueinander korrekt erfasst, nicht nur einzelne Achsenwerte. Kein
      Schneckengetriebe: dafür nennt S. 52 zusätzliche Betriebsfaktoren.

  - id: q-013
    category: diagram
    question: >-
      Ich lege ein Kegelradgetriebe K87 aus: Wovon hängt der Betriebsfaktor fB außer vom Stoßgrad noch ab?
    expected_sources:
      - any_of_pages:
          - document_id: sew-katalog-projektierung
            page: 50
    required_facts:
      - "Der Betriebsfaktor fB hängt von der Schalthäufigkeit Z ab."
      - "Der Betriebsfaktor fB hängt von der täglichen Betriebszeit ab."
    supplementary_facts:
      - "Die tägliche Betriebszeit wird in den Stufen 8, 16 und 24 Stunden/Tag berücksichtigt."
      - "Zur Schalthäufigkeit zählen alle Anlauf- und Bremsvorgänge sowie Umschaltungen zwischen niedriger und hoher Drehzahl."
    notes: >-
      Härtefall: Diagramm hat drei parallele Skalen (24/16/8 Std.) statt nur
      einer, testet ob das System erkennt, dass fB von zwei unabhängigen
      Größen abhängt. Kein Schneckengetriebe: dafür kommen fB1 und fB2 hinzu
      (S. 52).

  - id: q-014
    category: diagram
    question: >-
      Nach welcher Formel prüfe ich, ob mein Flachgetriebe F87 für meine Last stark genug ist?
    expected_sources:
      - any_of_pages:
          - document_id: sew-katalog-projektierung
            page: 50
    required_facts:
      - "Die Auslegungsbedingung lautet Ma · fB ≤ Ma max."
      - "Das mit dem Betriebsfaktor multiplizierte Lastmoment darf das zulässige Höchstmoment des Getriebes nicht überschreiten."
    supplementary_facts:
      - "Der für die Anwendung ermittelte Betriebsfaktor muss kleiner oder gleich dem Betriebsfaktor des gewählten Getriebes (SEW-fB) sein."
      - "Der Betriebsfaktor ist definiert als fB = Ma max / Ma."
    notes: >-
      Auslegungsformel direkt über dem Diagramm, reines Ablesen einer Formel.
      Ob sie allein zur vollständigen Auslegung reicht, ist Gegenstand von
      q-015. Kein Schneckengetriebe (zusätzliche Betriebsfaktoren, S. 52).

  - id: q-015
    category: lookup
    question: >-
      Reicht Ma · fB ≤ Ma max, um mein Stirnradgetriebe R107 auszulegen, oder muss ich noch etwas prüfen?
    expected_sources:
      - any_of_pages:
          - document_id: sew-getriebe-ba
            page: 29
    required_facts:
      - "Die Prüfung Ma · fB ≤ Ma max allein reicht nicht aus."
      - "Zusätzlich ist eine thermische Prüfung der Wärmegrenzleistung nötig."
      - "Diese thermische Prüfung wird nötig, wenn eine Raumlage mit vollständig eingetauchter 1. Getriebestufe vorliegt."
      - "Die thermische Prüfung wird auch nötig, wenn eine hohe mittlere eintreibende Drehzahl vorliegt."
    supplementary_facts:
      - "Ma · fB ≤ Ma max prüft nur die mechanische Momenten-Auslegung."
      - "Für die thermische Prüfung werden weitere Daten benötigt: Getriebeübersetzung, Drehzahl, Motormoment, Umgebungstemperatur, Aufstellungsort und Einbausituation."
      - "Gegebenenfalls ist dafür Rücksprache mit SEW-EURODRIVE nötig."
    notes: >-
      Härtefall: Mechanische Auslegung und thermische Prüfung sind zwei
      unabhängige Bedingungen. Kein Schneckengetriebe (zusätzliche
      Betriebsfaktoren, Katalog S. 52). v4: lookup statt multi-hop, alle
      erforderlichen Fakten stehen auf S. 29; die Formel nennt die Frage
      selbst.

