  - id: q-030
    category: lookup
    question: >-
      Mit welchem Anziehdrehmoment werden die Messnippel für die
      Schwingungsmessung am Motor eingeschraubt?
    expected_sources:
      - document_id: sew-motoren-drn
        page: 64
    expected_facts:
      - "15 Nm."
    notes: >-
      Einfacher, eindeutiger Fließtext-Fakt aus dem Kapitel "Anbauvorrichtung
      für Messnippel".

  - id: q-031
    category: lookup
    question: >-
      Welches Zustandssignal (ZSW1.x) wird gesetzt, wenn eine Störung
      auftritt, und welches bei einer Warnung?
    expected_sources:
      - document_id: siemens-g120c-liste
        page: 454
    expected_facts:
      - "Eine Störung setzt das Zustandssignal ZSW1.3."
      - "Eine Warnung setzt das Zustandssignal ZSW1.7."
    notes: >-
      Härtefall: zwei strukturell ähnliche, aber unterschiedliche
      Bit-Zuordnungen (ZSW1.3 vs. ZSW1.7) für zwei leicht verwechselbare
      Begriffe, testet präzise Unterscheidung statt einer pauschalen Antwort.

  - id: q-032
    category: lookup
    question: >-
      Bei welchen Raumlagen ist bei einem R..-Getriebe die Wälzlager-
