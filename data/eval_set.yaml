# Eval-Set: Fragen mit erwarteten Belegseiten (Retrieval) und Fakten (Antwort).
version: v3
questions:
  - id: q-001
    category: diagram
    question: >-
      Zwischen welchen Bauteilen liegt das Distanzrohr in einem Stirnradgetriebe R..07 – R..167?
    expected_sources:
      - any_of_pages:
          - document_id: sew-getriebe-ba
            page: 12
    expected_facts:
      - "Das Distanzrohr [17] befindet sich zwischen Wälzlager [11] und Rad [6]."
    notes: >-
      Härtefall: räumliche Zuordnung aus einer Explosionszeichnung
      (Positionsnummern + Legende). Rad und Wälzlager kommen mehrfach vor,
      testet korrekte Disambiguierung über die Positionsnummer statt Raten.

  - id: q-002
    category: diagram
    question: >-
      Wo steht auf dem Typenschild meines DRN-Getriebemotors die Wärmeklasse?
    expected_sources:
      - any_of_pages:
          - document_id: sew-getriebe-ba
            page: 22
    expected_facts:
      - "Die Wärmeklasse befindet sich an Position [7] auf dem Typenschild."
      - "Position [7] ist links außen markiert."
      - "Position [7] liegt direkt unterhalb der Zeile mit CosΦ (Leistungsfaktor, Position [6])."
    notes: >-
      Härtefall: Positionsnummern nur über separate Legende erschließbar,
      testet ob Bild-Layout und Legende sinnvoll verknüpft werden. Bewusst
      nur nach der Position gefragt, nicht nach dem Wert (130(B)): das
      Typenschild ist ein Illustrationsbeispiel, der Wert keine echte
      Fachinformation.

  - id: q-003
    category: diagram
    question: >-
      Nutzen die Getriebebaureihen K.., S.. und W.. dieselbe Raumlagen-Darstellung, oder hat jede eine eigene?
    expected_sources:
      - any_of_pages:
          - document_id: sew-getriebe-ba
            page: 28
    expected_facts:
      - "K.., S.. und W.. nutzen dieselbe Raumlagen-Darstellung (M1-M6)."
      - "Das Handbuch bildet alle drei Baureihen gemeinsam in einer einzigen Grafik ab, nicht in getrennten Grafiken."
    notes: >-
      Härtefall: eine Abbildung deckt drei Produktfamilien ab, testet, ob
      Retrieval sie auch für S.. oder W.. findet, obwohl K.. zuerst genannt
      wird.
      v3: Belegseite 28 statt 29 (verzählt, die Raumlagen-Grafik steht auf S. 28).

  - id: q-004
    category: unanswerable
    question: >-
      Welche Akkulaufzeit hat der SINAMICS G120C im Batteriebetrieb?
    expected_sources: []
    expected_facts: []
    notes: >-
      Frage ergibt fachlich keinen Sinn (Umrichter hat keinen Akku), prüft,
      ob das System ablehnt/richtigstellt statt zu halluzinieren.

  - id: q-005
    category: lookup
    question: >-
      Unter welchen Bedingungen können erhöhte Planschverluste auftreten?
    expected_sources:
      - any_of_pages:
          - document_id: sew-getriebe-ba
            page: 29
    expected_facts:
      - "Erhöhte Planschverluste können auftreten, wenn die Raumlage bewirkt, dass die 1. Getriebestufe vollständig in den Schmierstoff eintaucht."
      - "Die entsprechenden Raumlagen sind im Kapitel Raumlagenblätter mit einem * gekennzeichnet."
      - "Erhöhte Planschverluste können auch auftreten, wenn eine hohe mittlere eintreibende Drehzahl zu hoher Umfangsgeschwindigkeit der Zahnräder der Eintriebsstufe führt."
    notes: >-
      Baseline-Lookup, zwei Bedingungen in einer Aufzählung, testet ob beide
      vollständig erfasst werden statt nur der ersten.

  - id: q-006
    category: table
    question: >-
      Wie fest ziehe ich eine Verschluss-Schraube M12 × 1,5 am Getriebe an, etwa die Ölablassschraube?
    expected_sources:
      - any_of_pages:
          - document_id: sew-getriebe-ba
            page: 80
    expected_facts:
      - "15 Nm."
    notes: >-
      Härtefall: direkt danach folgt eine optisch identische Tabelle mit
      anderen Gewinden (M16-M42) und anderen Werten, testet ob Retrieval
      beide Tabellen sauber unterscheidet statt sie zu vermischen.

  - id: q-007
    category: multi-hop
    question: >-
      In welchem Umgebungstemperaturbereich darf mein Stirnradgetriebe R.. mit Standard-CLP-Öl VG 220 laufen, und wo steht das?
    expected_sources:
      - any_of_pages:
          - document_id: sew-schmierstoffe
            page: 7
          - document_id: sew-getriebe-ba
            page: 212
      - any_of_pages:
          - document_id: sew-schmierstoffe
            page: 5
          - document_id: sew-getriebe-ba
            page: 209
    expected_facts:
      - "Standard-CLP-Öl VG 220 deckt für Stirnradgetriebe R.. den Umgebungstemperaturbereich von -15°C bis +40°C ab."
      - "-15 °C bis +80 °C über den Produkten ist die zulässige Ölsumpftemperatur, nicht die Umgebungstemperatur."
      - "Für VG 220 Standard-CLP ist u. a. das Produkt SEW GearOil Base 220 freigegeben."
      - "Für VG 220 Standard-CLP ist u. a. das Produkt Mobilgear 600 XP 220 freigegeben."
      - "Für VG 220 Standard-CLP ist u. a. das Produkt Klüberoil GEM 1-220 N freigegeben."
    notes: >-
      Härtefall: Die Tabelle nennt zwei Bereiche, Umgebung (-15 bis +40)
      und Ölsumpf je Produkt (-15 bis +80). Was welcher bedeutet, steht nur
      in der Legende (S. 5). Testet, ob die Antwort beide auseinanderhält;
      ein Lauf auf efb22b6 nannte -15 bis +80 als Umgebungstemperatur.
      v3: Zwei Quellen statt BA S. 70 (nur ein Verweis) und S. 7: die
      Tabelle (sew-schmierstoffe S. 7 oder sew-getriebe-ba S. 212) und die
      Legende (sew-schmierstoffe S. 5 oder sew-getriebe-ba S. 209); je Quelle
      reicht eine der beiden Seiten.

  - id: q-008
    category: multi-hop
    question: >-
      Umrichter zeigt F07011 Motor Übertemperatur. Wie reagiert der Umrichter, und was prüfe ich am Motor?
    expected_sources:
      - any_of_pages:
          - document_id: siemens-g120c-liste
            page: 501
      - any_of_pages:
          - document_id: sew-motoren-drn
            page: 261
    expected_facts:
      - "F07011 'Motor Übertemperatur' löst die Reaktion AUS2 aus."
      - "Mögliche Ursachen für F07011 laut Umrichter-Handbuch sind Motorüberlastung, zu hohe Motor-Umgebungstemperatur oder Drahtbruch/nicht angeschlossener Sensor."
      - "sew-motoren-drn nennt für 'Motor erwärmt sich zu stark' als Prüfschritt die Kühlluftzufuhr/-wege."
      - "sew-motoren-drn nennt als weiteren Prüfschritt die Kontrolle des Luftfilters."
      - "sew-motoren-drn nennt außerdem, ggf. einen Fremdlüfter nachzurüsten."
      - "sew-motoren-drn nennt als weiteren Prüfschritt die Einhaltung des zulässigen Umgebungstemperaturbereichs."
      - "sew-motoren-drn (Kapitel 9.4) verweist bei Störungen im Frequenzumrichterbetrieb explizit zurück auf die Umrichter-Betriebsanleitung."
    notes: >-
      Entspricht dem zweiten cross_references-Muster in corpus.yaml
      (Störcode am Umrichter und Auswirkung auf den Motor). Härtefall: beide
      Dokumente verweisen wechselseitig aufeinander, testet ob Retrieval
      beide Richtungen findet, nicht nur eine.

  - id: q-009
    category: lookup
    question: >-
      Wie oft muss ich beim DRN-Motor die Wälzlager prüfen, Wellendichtringe wechseln und Kühlluftwege reinigen?
    expected_sources:
      - any_of_pages:
          - document_id: sew-motoren-drn
            page: 131
    expected_facts:
      - "Alle 10000 Betriebsstunden."
    notes: >-
      Einfacher Fließtext-Lookup aus einer Wartungsintervall-Tabelle (Baseline).

  - id: q-010
    category: lookup
    question: >-
      Kann ich STO am G120C als Not-Aus verwenden?
    expected_sources:
      - any_of_pages:
          - document_id: siemens-g120c-kurz
            page: 270
    expected_facts:
      - "STO eignet sich zur Realisierung eines Not-Halts."
      - "STO eignet sich nicht zur Realisierung eines Not-Aus."
      - "STO schaltet keine elektrische Spannung sicher aus."
    notes: >-
      Kontraintuitiver Fakt: STO ≠ Not-Aus, obwohl STO den Antrieb sicher
      stoppt. Testet, ob das System die Nuance wiedergibt statt pauschal
      zuzustimmen.
      v3: Belegseite 270 statt 264 (gedruckte statt PDF-Seitenzahl).

