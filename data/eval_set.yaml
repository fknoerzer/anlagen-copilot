  - id: q-034
    category: multi-hop
    question: >-
      Unser älterer Energiesparmotor vom Typ DTE ist als EFF1 eingestuft, der neue Motor DRN90L4 hat IE3 auf dem Typenschild. Sind das dieselben Effizienzklassen?
    expected_sources:
      - any_of_pages:
          - document_id: sew-katalog-projektierung
            page: 16
      - any_of_pages:
          - document_id: sew-getriebe-ba
            page: 22
          - document_id: sew-motoren-drn
            page: 23
    required_facts:
      - "EFF1 ist eine Wirkungsgradklasse nach der Vereinbarung des CEMEP (Klassen EFF3, EFF2, EFF1; EFF1 bezeichnet hoch effiziente Motoren)."
      - "IE3 ist eine Energie-Effizienzklasse nach IEC 60034-30-1."
      - "Es sind zwei verschiedene Klassifizierungen, die Klassen lassen sich nicht direkt gleichsetzen."
    supplementary_facts:
      - "DRN-Motoren sind Energiesparmotoren der Klasse Premium-Efficiency IE3; DR2S-Motoren entsprechen IE1, DRU-Motoren IE4."
      - "DTE/DVE-Motoren der Größen 90S bis 280M werden als Energiesparmotoren bezeichnet."
    notes: >-
      Härtefall: EFF und IE klingen ähnlich, sind aber zwei Systeme aus
      verschiedenen Dokumenten. Die Klassenzeichen auf S. 16 (EFF1, EFF2)
      sind Bilder, pypdf liefert sie nicht. v4: Ersetzt eine Frage nach
      "Katalog (Kapitel 2.3)" und "Beispiel-Typenschild"; Fakten ohne Beleg
      im Korpus (EFF durch IE ersetzt, Alter des Katalogs) entfernt.

