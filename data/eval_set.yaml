      einen Wert zu nennen. v3: Belegseite 369 statt 363 (gedruckte statt
      PDF-Seitenzahl). Der Hinweis zum Derating gilt für alle Zeilen über
      +40 °C, pypdf ordnet ihn nur der Zeile FSAA zu.

