services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: anlagen_copilot
      POSTGRES_PASSWORD: anlagen_copilot
      POSTGRES_DB: anlagen_copilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anlagen_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
